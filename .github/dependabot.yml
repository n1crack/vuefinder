# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 10
    ignore:
      # TypeScript 7 ships only the native binary and `unstable/*` APIs, with no
      # classic compiler API, so vue-tsc cannot run against it. Both type-check
      # and type-gen depend on vue-tsc, so stay on 5.x until vue-language-tools
      # supports tsgo.
      - dependency-name: 'typescript'
        update-types:
          - 'version-update:semver-major'
    groups:
      # @uppy/* packages peer-depend on a matching @uppy/core major, so a
      # single-package major bump always fails to resolve. Ship them together.
      uppy:
        patterns:
          - '@uppy/*'
        update-types:
          - 'major'
          - 'minor'
          - 'patch'
      # Keep the noise down: batch routine updates into single PRs.
      dev-dependencies:
        dependency-type: 'development'
        update-types:
          - 'minor'
          - 'patch'
      production-dependencies:
        dependency-type: 'production'
        update-types:
          - 'minor'
          - 'patch'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
